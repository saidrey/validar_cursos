<header class="sticky top-0 z-50 w-full bg-white/90 dark:bg-slate-900/92 backdrop-blur-md border-b border-slate-200 dark:border-slate-700">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-20">
      <!-- Logo -->
      <a routerLink="/" class="flex items-center gap-2">
        <div class="bg-primary p-1.5 rounded-lg text-white">
          <span class="material-symbols-outlined block">school</span>
        </div>
        <div class="hidden sm:flex flex-col leading-tight">
          <span class="text-xl font-extrabold tracking-tight text-slate-900 dark:text-slate-100">Aula Virtual</span>
          <span class="text-xl font-extrabold tracking-tight text-slate-900 dark:text-slate-100">Centro de Competencias</span>
        </div>
      </a>

      <!-- Navigation Menu -->
      <nav class="hidden md:flex items-center space-x-10">
        <a routerLink="/" routerLinkActive="text-primary" [routerLinkActiveOptions]="{exact: true}"
           class="text-sm font-semibold text-slate-700 dark:text-slate-300 hover:text-primary transition-colors">
          Inicio
        </a>
        <a routerLink="/cursos" routerLinkActive="text-primary"
           class="text-sm font-semibold text-slate-700 dark:text-slate-300 hover:text-primary transition-colors">
          Cursos
        </a>
        <a routerLink="/validar" routerLinkActive="text-primary"
           class="text-sm font-semibold text-slate-700 dark:text-slate-300 hover:text-primary transition-colors">
          Validar
        </a>
        <a routerLink="/contacto" routerLinkActive="text-primary"
           class="text-sm font-semibold text-slate-700 dark:text-slate-300 hover:text-primary transition-colors">
          Contacto
        </a>
      </nav>

      <!-- CTA + Controles de accesibilidad + Hamburguesa -->
      <div class="flex items-center gap-2">

        <!-- Control de tamaño de fuente -->
        <div class="hidden sm:flex items-center gap-1 border border-slate-200 dark:border-slate-600 rounded-lg px-1 py-1"
             role="group"
             aria-label="Tamaño del texto">
          <button
            (click)="fontSizeService.decrease()"
            [disabled]="fontSizeService.isMin()"
            aria-label="Reducir tamaño de texto"
            class="w-7 h-7 flex items-center justify-center rounded text-slate-600 dark:text-slate-300
                   hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors
                   disabled:opacity-40 disabled:cursor-not-allowed
                   text-xs font-bold">
            A−
          </button>
          <!-- aria-live anuncia el cambio al lector de pantalla sin interrumpir -->
          <span class="text-xs text-slate-400 dark:text-slate-500 w-6 text-center select-none"
                aria-live="polite"
                aria-atomic="true">
            {{ fontSizeService.currentIndex() === 0 ? 'N' : fontSizeService.currentIndex() === 1 ? 'M' : 'G' }}
          </span>
          <button
            (click)="fontSizeService.increase()"
            [disabled]="fontSizeService.isMax()"
            aria-label="Aumentar tamaño de texto"
            class="w-7 h-7 flex items-center justify-center rounded text-slate-600 dark:text-slate-300
                   hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors
                   disabled:opacity-40 disabled:cursor-not-allowed
                   text-sm font-bold">
            A+
          </button>
        </div>

        <!-- Toggle dark/light mode -->
        <button
          (click)="themeService.toggle()"
          [attr.aria-label]="themeService.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
          [attr.aria-pressed]="themeService.isDark()"
          class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
          title="{{ themeService.isDark() ? 'Modo claro' : 'Modo oscuro' }}">
          @if (themeService.isDark()) {
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 3v1m0 16v1m8.66-10H21M3 12H2m15.07-7.07l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
          }
        </button>

        <a routerLink="/login"
           class="bg-primary hover:bg-primary/90 text-white px-6 py-2.5 rounded-lg text-sm font-bold transition-all shadow-md shadow-primary/20">
          Login
        </a>
        <!-- Botón hamburguesa (solo mobile) -->
        <button class="md:hidden p-2 rounded-lg text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
                (click)="toggleMenu()"
                [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'">
          @if (menuOpen()) {
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          }
        </button>
      </div>
    </div>
  </div>

  <!-- Menú mobile desplegable -->
  @if (menuOpen()) {
    <div class="md:hidden border-t border-slate-200 dark:border-slate-700 bg-white/95 dark:bg-slate-900/96 backdrop-blur-md">
      <nav class="max-w-7xl mx-auto px-4 py-4 flex flex-col gap-1">
        <a routerLink="/" routerLinkActive="text-primary bg-blue-50" [routerLinkActiveOptions]="{exact: true}"
           (click)="closeMenu()"
           class="px-4 py-3 rounded-lg text-sm font-semibold text-slate-700 dark:text-slate-300 hover:text-primary hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
          Inicio
        </a>
        <a routerLink="/cursos" routerLinkActive="text-primary bg-blue-50"
           (click)="closeMenu()"
           class="px-4 py-3 rounded-lg text-sm font-semibold text-slate-700 dark:text-slate-300 hover:text-primary hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
          Cursos
        </a>
        <a routerLink="/validar" routerLinkActive="text-primary bg-blue-50"
           (click)="closeMenu()"
           class="px-4 py-3 rounded-lg text-sm font-semibold text-slate-700 dark:text-slate-300 hover:text-primary hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
          Validar
        </a>
        <a routerLink="/contacto" routerLinkActive="text-primary bg-blue-50"
           (click)="closeMenu()"
           class="px-4 py-3 rounded-lg text-sm font-semibold text-slate-700 dark:text-slate-300 hover:text-primary hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
          Contacto
        </a>
      </nav>
    </div>
  }
</header>
